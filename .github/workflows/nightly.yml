name: Nightly

# US-OPS-04 (NFR-REL-03, D-262) — backup and restore are checked every night,
# once the repo is public (Actions minutes are free then). Until then they're
# checked on every release tag (ci.yml).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-verify:
    name: Restore verify
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    uses: ./.github/workflows/restore-verify.yml
