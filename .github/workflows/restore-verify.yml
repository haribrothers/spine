name: Restore verify

# US-OPS-04 (NFR-REL-03) — installs Spine from this commit's images, seeds the
# demo business, backs it up (encrypted), wipes the install, restores it into a
# clean one and checks the trial balance and the files match
# (scripts/ci/restore-verify.sh). Called by CI on release tags and manual runs,
# and by nightly.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  restore-verify:
    name: Restore verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Loaded into this runner's Docker under the names the release's Compose file pulls.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          tags: ghcr.io/haribrothers/spine-api:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,scope=api-amd64

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          tags: ghcr.io/haribrothers/spine-web:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64

      - name: Back up, wipe, restore and compare
        run: scripts/ci/restore-verify.sh
