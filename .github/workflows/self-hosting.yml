name: Self-hosting checks

# With this commit's images built once:
# - restore-verify (US-OPS-04, NFR-REL-03): install, seed the demo business,
#   back up (encrypted), wipe, restore into a clean install, compare the trial
#   balance and the files (scripts/ci/restore-verify.sh);
# - upgrade-verify (US-OPS-50, NFR-MNT-02): install the previous release with
#   the demo business, upgrade it to this commit with upgrade.sh, compare
#   (scripts/ci/upgrade-verify.sh; nothing to do before the first release).
# Called by CI on release tags and manual runs, and by nightly.yml.
on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  self-hosting:
    name: Restore and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Every tag, to find the previous release.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Loaded into this runner's Docker under the names the release's Compose file pulls.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          tags: ghcr.io/haribrothers/spine-api:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=api-amd64
          cache-to: type=gha,mode=max,scope=api-amd64

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          tags: ghcr.io/haribrothers/spine-web:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64

      - name: Back up, wipe, restore and compare
        run: scripts/ci/restore-verify.sh

      # The previous release's images, which are private until the repo is public at v1.0.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade from the previous release and compare
        run: scripts/ci/upgrade-verify.sh
        env:
          GH_TOKEN: ${{ github.token }}
