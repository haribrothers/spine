name: CI

# Runs only on pull requests into main (and on demand). Work happens on a
# phase branch; the pipeline runs once the phase is ready for review.
# Tuned for a private repo's Actions-minutes budget: docs-only changes,
# draft PRs and superseded runs are skipped, and installs, Turbo results
# and Playwright browsers are cached.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".vscode/**"
      - "LICENSE"
  workflow_dispatch:

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Unit and integration
    # Draft PRs don't use minutes; marking the PR "Ready for review" starts the run.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Scoped to this job: the E2E job must read its own values from .env.e2e,
    # and dotenv never overrides variables that are already set.
    env:
      DATABASE_URL: postgres://spine:spine@localhost:5432/spine
      AUTH_SECRET: ci-test-secret-not-for-production-use-only
      APP_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spine
          POSTGRES_PASSWORD: spine
          POSTGRES_DB: spine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        # Node 22: the test tooling needs it (jsdom 30 requires ^22.22.2, undici 8 >=22.19).
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint/typecheck/test depend on ^build, so Turbo builds the shared
      # packages they need. The apps' production builds run once, in the E2E job.
      - name: Lint
        run: pnpm turbo run lint --cache-dir=.turbo

      - name: Typecheck
        run: pnpm turbo run typecheck --cache-dir=.turbo

      # @spine/e2e's "test" is the Playwright suite; it runs in the E2E job, not here.
      - name: Unit tests
        run: pnpm turbo run test --cache-dir=.turbo --filter=!@spine/e2e

      - name: Run DB migrations
        run: pnpm --filter @spine/api db:migrate

      - name: Integration tests
        run: pnpm --filter @spine/api test:integration

  e2e:
    name: E2E
    # Only spend E2E minutes once unit and integration tests pass.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spine
          POSTGRES_PASSWORD: spine
          POSTGRES_DB: spine_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      maildev:
        image: maildev/maildev
        ports:
          - 1080:1080
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
            turbo-test-${{ runner.os }}-

      # Playwright starts the API and web app with their own build commands,
      # which expect the workspace packages they import (@spine/shared, @spine/sdk) to be built.
      - name: Build workspace dependencies
        run: pnpm turbo run build --cache-dir=.turbo --filter=@spine/api^... --filter=@spine/web^...

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @spine/e2e install-browsers

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @spine/e2e exec playwright install-deps chromium

      - name: Run E2E suite
        run: pnpm --filter @spine/e2e test
        env:
          CI: "true"

      # Kept only when something fails, and only for 3 days, to save artifact storage.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 3
          if-no-files-found: ignore
