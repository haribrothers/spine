name: Something isn't working
description: A bug in Spine, the field app or the install scripts
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A security problem? Don't file it here; report it privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Open Invoices\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spine version
      description: Settings › About Spine (or the field app's Profile)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web app, Field app (Android), Field app (iPhone), Install / backup / upgrade, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error reference
      description: An error page's reference, or the relevant lines from `docker compose logs api`. Remove anything private first.
      render: text
