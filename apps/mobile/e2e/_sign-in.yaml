# Shared: a clean install, signed in as the demo Field user, on Today.
# SERVER/EMAIL/PASSWORD as in us-mob-01-sign-in.yaml.
appId: com.h4loom.spine
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: _open-app.yaml
# A clean install opens on Welcome (US-MOB-26).
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Use the email your office invited you with."
    timeout: 10000
- tapOn:
    id: "sign-in-server"
- eraseText: 60
- inputText: ${SERVER || "http://localhost:4000"}
- tapOn:
    id: "sign-in-email"
- eraseText: 60
- inputText: ${EMAIL || "marcus.webb.demo@example.com"}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD || "DemoPassword123!"}
# The title also says "Sign in"; the button is the one below the password.
- tapOn:
    text: "Sign in"
    below:
      id: "sign-in-password"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "today-welcome"
    timeout: 20000
