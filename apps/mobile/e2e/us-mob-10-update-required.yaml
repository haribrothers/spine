# US-MOB-10 — an app older than the server's minimum. Start the API with
# MOBILE_MIN_VERSION=99.0.0 and an existing session on the phone (run
# us-mob-01-sign-in.yaml without its last two steps first), then:
#   maestro test apps/mobile/e2e/us-mob-10-update-required.yaml
appId: com.h4loom.spine
---
- launchApp
- runFlow: _open-app.yaml
- extendedWaitUntil:
    visible: "Update Spine to keep going"
    timeout: 60000
- assertVisible: "Your company's Spine server needs a newer version of this app. It only takes a minute."
- assertVisible:
    id: "update-open-store"
